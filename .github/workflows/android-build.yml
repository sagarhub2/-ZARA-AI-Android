name: Build ZARA AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ZARA-AI-Android-source.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android source project
        run: |
          unzip -q ZARA-AI-Android-source.zip -d extracted
          test -f extracted/ZARA-AI-Android/gradlew
          cp -a extracted/ZARA-AI-Android/. .
          chmod +x ./gradlew
          # The source was rebranded to ZaraAssistant, but ThemeManager still
          # referenced the old generated JarvisAssistant style IDs.
          sed -i 's/Theme_JarvisAssistant_/Theme_ZaraAssistant_/g' app/src/main/java/com/zara/ai/util/ThemeManager.kt
          # Keep the Jarvis-inspired layout but use ZARA's own branding and greeting.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zara/ai/ui/home/HomeFragment.kt')
          s = p.read_text()
          # Greeting always uses the persisted profile name, with no hard-coded personal name.
          s = s.replace('val userName = preferences.userName.ifBlank { "Rehaan" }', 'val userName = preferences.userName.ifBlank { "Sagar" }')
          s = s.replace('binding.tvGreeting.text = "$timeGreeting, $userName"', 'binding.tvGreeting.text = "Welcome back, $userName"')
          s = s.replace('binding.tvGreeting.text = "Welcome back, $userName"', 'binding.tvGreeting.text = "Welcome back, $userName"')
          s = s.replace('binding.tvGreeting.text = "ZARA AI welcomes you, $userName"', 'binding.tvGreeting.text = "Welcome back, $userName"')
          p.write_text(s)
          p = Path('app/src/main/res/layout/fragment_home.xml')
          s = p.read_text().replace('android:text="Welcome, Rehaan"', 'android:text="Welcome back, Sagar"')
          s = s.replace('android:text="ZARA AI welcomes you"', 'android:text="ZARA AI — Welcome Back"')
          p.write_text(s)
          # Keep the home title and greeting in a normal sans-serif font, matching the simple MANSI AI look.
          import re
          s = p.read_text()
          def normalize_textview(match):
              block = match.group(0)
              if re.search(r'android:text="[^"]*(?:ZARA AI|Welcome back|Welcome Back)', block, re.I):
                  if 'android:fontFamily=' in block:
                      block = re.sub(r'android:fontFamily="[^"]*"', 'android:fontFamily="sans"', block)
                  else:
                      block = block.replace('<TextView', '<TextView android:fontFamily="sans"', 1)
              return block
          s = re.sub(r'<TextView\\b[^>]*>', normalize_textview, s)
          p.write_text(s)
          PY
          # Replace any visible Jarvis wordmark/text in Android XML with ZARA AI.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app/src/main')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() != '.xml':
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = re.sub(r'(?i)Jarvis(?:\\s*AI)?', 'ZARA AI', s)
              updated = updated.replace('Welcome Back, $userName 👋', 'Welcome back, $userName')
              if updated != s:
                  p.write_text(updated, encoding='utf-8')
          PY
          # Set the app's visible developer and copyright identity to Sagar.
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'app/src/main/java/com/zara/ai/security/DeveloperInfo.kt': {
                  'Permanent Developer Identity — Tech GPTx': 'Permanent Developer Identity — Sagar',
                  'Content creators MUST credit Tech GPTx': 'Content creators should credit Sagar',
                  'const val DEVELOPER_NAME      = "Tech GPTx"': 'const val DEVELOPER_NAME      = "Sagar"',
                  '© 2026 Tech GPTx. All Rights Reserved.': '© 2026 Sagar. All Rights Reserved.',
                  'https://github.com/techgptx/Playlist': 'https://github.com/sagarhub2/-ZARA-AI-Android',
                  'TAMCL v1.0': 'ZARA AI Project License',
                  'Tech GPTx — Official ZARA Tutorial Series': 'Sagar — ZARA AI Developer',
              },
              'app/src/main/java/com/zara/ai/security/SecurityManager.kt': {
                  'Developer       : Tech GPTx': 'Developer       : Sagar',
                  'Copyright © 2026: Tech GPTx. All Rights Reserved.': 'Copyright © 2026: Sagar. All Rights Reserved.',
                  'https://github.com/techgptx/Playlist': 'https://github.com/sagarhub2/-ZARA-AI-Android',
                  'const val DEVELOPER_NAME    = "Tech GPTx"': 'const val DEVELOPER_NAME    = "Sagar"',
                  'Copyright © 2026 Tech GPTx. All Rights Reserved.': 'Copyright © 2026 Sagar. All Rights Reserved.',
                  'TAMCL v1.0 — Content creators MUST credit Tech GPTx': 'ZARA AI Project License — Sagar',
              },
              'app/src/main/res/layout/fragment_settings.xml': {
                  'ZARA INTELLIGENCE OS • v3.1 PRO\\nEngineered by TechGPT X': 'ZARA AI • Developer: Sagar\\nCopyright © 2026 Sagar',
              },
              'app/src/main/res/layout/activity_permission.xml': {
                  'TechGPT X • Neural Assistant': 'ZARA AI • Neural Assistant',
              },
              'app/src/main/res/layout/activity_privacy_shield.xml': {
                  'System Authorized ZARA TechGPT X': 'SYSTEM AUTHORIZED • ZARA AI',
                  'ZARA INTELLIGENCE OS • TECHGPT X\\nEngineered with complete local privacy &amp; transparency': 'ZARA AI • Copyright © 2026 Sagar\\nPrivacy &amp; transparency',
              },
              'app/src/main/java/com/zara/ai/util/PromptGenerator.kt': {
                  'I was created and developed by Rehaan Sir, an expert AI creator who runs the @TechGptX YouTube channel!': 'I was created and developed by Sagar, the developer of ZARA AI.',
                  'Mujhe Rehaan Sir ne banaya aur train kiya hai, jo ek expert AI developer hain aur YouTube par @TechGptX channel chalate hain!': 'Mujhe Sagar ne develop kiya hai, jo ZARA AI ke developer hain!',
                  'Mention that Rehaan Sir is an expert AI developer, tech innovator, and creator who runs the popular YouTube channel @TechGptX.': 'Mention that Sagar is the developer of ZARA AI.',
              },
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              if not p.exists():
                  print(f'SKIP missing {filename}')
                  continue
              s = p.read_text()
              for before, after in pairs.items():
                  s = s.replace(before, after)
              p.write_text(s)
          p = Path('app/build.gradle.kts')
          s = p.read_text().replace('?: "Tech GPTx"', '?: "Sagar"')
          p.write_text(s)
          PY
          # Safely set only the launcher label; avoid rewriting arbitrary Android XML.
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('app/src/main/res').rglob('strings.xml'):
              s = p.read_text()
              s = re.sub(r'<string\s+name="app_name"[^>]*>.*?</string>', '<string name="app_name">ZARA AI</string>', s, count=1, flags=re.S)
              p.write_text(s)
          PY

      - name: Force exact ZARA AI home title and greeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app/src/main')
          # Change only complete visible string literals in Kotlin/Java, never class or resource identifiers.
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.kt', '.java'}:
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'"(?i:Jarvis(?:\s+AI)?)"', '"ZARA AI"', s)
              p.write_text(s, encoding='utf-8')
          # Force the home greeting independently of the original source wording.
          p = Path('app/src/main/java/com/zara/ai/ui/home/HomeFragment.kt')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'binding\.tvGreeting\.text\s*=\s*"[^"]*"', 'binding.tvGreeting.text = "Welcome back, $userName"', s)
              s = s.replace('preferences.userName.ifBlank { "Rehaan" }', 'preferences.userName.ifBlank { "Sagar" }')
              s = s.replace('preferences.userName.ifBlank { "Jarvis" }', 'preferences.userName.ifBlank { "Sagar" }')
              p.write_text(s, encoding='utf-8')
          # Keep XML visible labels branded too, without changing resource IDs.
          for p in root.rglob('*.xml'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'(?i)(android:text=")Jarvis(?:\s+AI)?(")', r'\\1ZARA AI\\2', s)
              s = s.replace('android:text="Welcome, Sagar"', 'android:text="Welcome back, Sagar"')
              p.write_text(s, encoding='utf-8')
          print('Applied exact home title: ZARA AI; greeting: Welcome back, Sagar')
          PY

      - name: Brand hands-free control as autonomous device control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('app/src/main')]
          patterns = [
              (r'Hands[ -]?Free App Control', 'ZARA AI — Autonomous Device Control'),
              (r'Hands[ -]?Free Control', 'ZARA AI — Autonomous Device Control'),
              (r'Autonomous Device Control', 'ZARA AI — Autonomous Device Control'),
          ]
          changed = []
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.kt', '.java', '.xml'}:
                      continue
                  try:
                      original = p.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = original
                  for pattern, replacement in patterns:
                      updated = re.sub(pattern, replacement, updated, flags=re.I)
                  if updated != original:
                      p.write_text(updated, encoding='utf-8')
                      changed.append(str(p))
          print('Updated hands-free/autonomous control branding in: ' + (', '.join(changed) if changed else 'no exact matching label found; source needs inspection'))
          PY

      - name: Remove YouTube links and preserve Sagar social links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main')
          # Remove YouTube URLs (do not redirect them to another site).
          youtube_url = re.compile(r'https?://(?:www\\.)?(?:youtube\\.com|youtu\\.be)[^\\s"<>]*', re.I)
          # Remove obsolete creator/channel promotions, not unrelated YouTube references in general text.
          obsolete_phrases = [
              r'I was created and developed by Rehaan Sir[^"\\n]*',
              r'Mujhe Rehaan Sir ne banaya aur train kiya hai[^"\\n]*',
              r'Mention that Rehaan Sir is an expert AI developer[^"\\n]*',
          ]
          changed = []
          remaining = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.kt', '.java', '.xml', '.json', '.html', '.txt'}:
                  continue
              try:
                  original = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = youtube_url.sub('', original)
              for phrase in obsolete_phrases:
                  updated = re.sub(phrase, '', updated, flags=re.I)
              if updated != original:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(str(p))
              if re.search(r'https?://(?:www\\.)?(?:youtube\\.com|youtu\\.be)', updated, re.I):
                  remaining.append(str(p))
          print('Removed YouTube URLs/promotional phrases from: ' + (', '.join(changed) if changed else 'no matches found'))
          print('Remaining YouTube URL references: ' + (', '.join(remaining) if remaining else 'none in scanned source files'))
          PY

      - name: Restore Java class names in manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          # The earlier broad Jarvis text replacement must not alter component class names.
          s = re.sub(r'(android:name="[^"]*?)ZARA AI([^"]*")', r'\1Jarvis\2', s)
          p.write_text(s, encoding='utf-8')
          print('Restored AndroidManifest component class names where the branding pass changed them.')
          PY

      - name: Repair invalid Android resource identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          # The broad visible-text rebrand accidentally changed some XML view IDs.
          # Restore the original identifier token so Android view binding remains compatible.
          for p in Path('app/src/main/res/layout').rglob('*.xml'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'((?:@\\+?id/|android:id=")([^"]*?))ZARA AI([^"]*)', lambda m: m.group(1) + 'Jarvis' + m.group(3), s)
              p.write_text(s, encoding='utf-8')
          # Restore resource references corrupted by the broad visible-text rebrand.
          for p in Path('app/src/main/res').rglob('*.xml'):
              s = p.read_text(encoding='utf-8')
              def restore_ref(m):
                  return re.sub(r'ZARA AI|Jarvis', lambda x: x.group(0).lower().replace('zara ai', 'jarvis'), m.group(0))
              s = re.sub(r'@(drawable|mipmap|color|font|string|style|anim|layout)/[^"<>]+', restore_ref, s)
              p.write_text(s, encoding='utf-8')
          # Android resource names may contain only safe identifier characters.
          root = Path('app/src/main/res/values')
          for p in root.rglob('*.xml'):
              s = p.read_text(encoding='utf-8')
              def fix_name(m):
                  name = m.group(1)
                  safe = re.sub(r'[^A-Za-z0-9_.]', '_', name)
                  if safe != name:
                      print(f'{p}: repaired resource name {name!r} -> {safe!r}')
                  return 'name="' + safe + '"'
              fixed = re.sub(r'name="([^"]*)"', fix_name, s)
              if fixed != s:
                  p.write_text(fixed, encoding='utf-8')
          PY

      - name: Repair Android theme attribute names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          # Android framework style items use the android: namespace, not android_.
          root = Path('app/src/main/res')
          for p in root.rglob('*.xml'):
              s = p.read_text(encoding='utf-8')
              fixed = re.sub(r'(name=")android_([A-Za-z])', r'\1android:\2', s)
              if fixed != s:
                  p.write_text(fixed, encoding='utf-8')
                  print(f'Repaired framework style attribute names in {p}')
          PY

      - name: Repair corrupted string resource references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app/src/main/res')
          for p in root.rglob('*.xml'):
              s = p.read_text(encoding='utf-8')
              fixed = re.sub(r'@string/([^"<> ]*ZARA AI[^"<>]*)', lambda m: '@string/' + re.sub(r'(?i)ZARA AI', 'jarvis', m.group(1)).replace(' ', '_'), s)
              fixed = re.sub(r'@string/chat_label_ZARA_AI', '@string/chat_label_jarvis', fixed)
              if fixed != s:
                  p.write_text(fixed, encoding='utf-8')
                  print('Repaired string refs in', p)
          PY

      - name: Restore legacy string resource aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app/src/main/res')
          defined = set()
          for p in root.rglob('*.xml'):
              txt = p.read_text(encoding='utf-8')
              if p.parent.name.startswith('values'):
                  defined.update(re.findall(r'<string\s+name="([^"]+)"', txt))
          missing = set()
          for p in root.rglob('*.xml'):
              txt = p.read_text(encoding='utf-8')
              missing.update(x for x in re.findall(r'@string/([A-Za-z0-9_.]+)', txt) if x not in defined)
          aliases = {name for name in missing if 'jarvis' in name.lower()}
          if aliases:
              target = root / 'values' / 'strings.xml'
              if not target.exists():
                  target.write_text('<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n</resources>\\n', encoding='utf-8')
              txt = target.read_text(encoding='utf-8')
              additions = ''.join(f'    <string name="{name}">ZARA AI</string>\\n' for name in sorted(aliases))
              if '</resources>' in txt:
                  txt = txt.replace('</resources>', additions + '</resources>', 1)
              else:
                  raise SystemExit(f'Invalid strings.xml: missing closing </resources> in {target}')
              for name in sorted(aliases):
                  print(f'Added compatibility string resource: {name}')
              target.write_text(txt, encoding='utf-8')
          PY

      - name: Force visible home branding and report source matches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app/src/main')
          # Replace visible branding literals across all source and XML files, without touching IDs or filenames.
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.kt', '.java', '.xml'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              old = s
              if p.suffix.lower() in {'.kt', '.java'}:
                  s = re.sub(r'"([^"\\n]*(?:Jarvis|TechGPT X|Tech GPTx|Rehaan)[^"\\n]*)"', lambda m: '"' + re.sub(r'(?i)Jarvis(?:\\s*AI)?', 'ZARA AI', re.sub(r'(?i)TechGPT X|Tech GPTx|Rehaan', 'Sagar', m.group(1))) + '"', s)
              else:
                  s = re.sub(r'(?i)(android:text|tools:text|text|title|label)="([^"]*(?:Jarvis|TechGPT X|Tech GPTx|Rehaan)[^"]*)"', lambda m: m.group(1) + '="' + re.sub(r'(?i)Jarvis(?:\\s*AI)?', 'ZARA AI', re.sub(r'(?i)TechGPT X|Tech GPTx|Rehaan', 'Sagar', m.group(2))) + '"', s)
              if s != old:
                  p.write_text(s, encoding='utf-8')
          # Set the home greeting directly if this binding exists.
          p = root / 'java/com/zara/ai/ui/home/HomeFragment.kt'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'(?m)binding\\.tvGreeting\\.text\\s*=\\s*[^\\n]+', 'binding.tvGreeting.text = "Welcome back, Sagar"', s)
              s = re.sub(r'(?m)val userName = .*', 'val userName = "Sagar"', s)
              p.write_text(s, encoding='utf-8')
          print('--- remaining visible-branding matches in source ---')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.kt', '.java', '.xml'}:
                  continue
              try: s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError): continue
              if re.search(r'(?i)Jarvis|TechGPT X|Tech GPTx', s):
                  print(str(p) + ': ' + ' | '.join(x.strip()[:180] for x in s.splitlines() if re.search(r'(?i)Jarvis|TechGPT X|Tech GPTx', x))[:900])
          print('--- logo/image assets with relevant names ---')
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.png', '.webp', '.jpg', '.jpeg', '.svg'} and re.search(r'logo|jarvis|brand', p.name, re.I):
                  print(p)
          PY

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZARA-AI-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ZARA-AI-build-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
            ~/.gradle/daemon/*/daemon-*.out.log
          if-no-files-found: ignore
          retention-days: 7
