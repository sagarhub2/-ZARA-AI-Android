name: Build ZARA AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ZARA-AI-Android-source.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android source project
        run: |
          unzip -q ZARA-AI-Android-source.zip -d extracted
          test -f extracted/ZARA-AI-Android/gradlew
          cp -a extracted/ZARA-AI-Android/. .
          chmod +x ./gradlew
          # The source was rebranded to ZaraAssistant, but ThemeManager still
          # referenced the old generated JarvisAssistant style IDs.
          sed -i 's/Theme_JarvisAssistant_/Theme_ZaraAssistant_/g' app/src/main/java/com/zara/ai/util/ThemeManager.kt
          # Keep the Jarvis-inspired layout but use ZARA's own branding and greeting.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zara/ai/ui/home/HomeFragment.kt')
          s = p.read_text()
          # Greeting always uses the persisted profile name, with no hard-coded personal name.
          s = s.replace('val userName = preferences.userName.ifBlank { "Rehaan" }', 'val userName = preferences.userName.ifBlank { "User" }')
          s = s.replace('binding.tvGreeting.text = "$timeGreeting, $userName"', 'binding.tvGreeting.text = "ZARA AI — Welcome Back, $userName 👋"')
          s = s.replace('binding.tvGreeting.text = "Welcome back, $userName"', 'binding.tvGreeting.text = "ZARA AI — Welcome Back, $userName 👋"')
          s = s.replace('binding.tvGreeting.text = "ZARA AI welcomes you, $userName"', 'binding.tvGreeting.text = "ZARA AI — Welcome Back, $userName 👋"')
          p.write_text(s)
          p = Path('app/src/main/res/layout/fragment_home.xml')
          s = p.read_text().replace('android:text="Welcome, Rehaan"', 'android:text="ZARA AI — Welcome Back"')
          s = s.replace('android:text="ZARA AI welcomes you"', 'android:text="ZARA AI — Welcome Back"')
          p.write_text(s)
          PY
          # Set the app's visible developer and copyright identity to Sagar.
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'app/src/main/java/com/zara/ai/security/DeveloperInfo.kt': {
                  'Permanent Developer Identity — Tech GPTx': 'Permanent Developer Identity — Sagar',
                  'Content creators MUST credit Tech GPTx': 'Content creators should credit Sagar',
                  'const val DEVELOPER_NAME      = "Tech GPTx"': 'const val DEVELOPER_NAME      = "Sagar"',
                  '© 2026 Tech GPTx. All Rights Reserved.': '© 2026 Sagar. All Rights Reserved.',
                  'https://github.com/techgptx/Playlist': 'https://github.com/sagarhub2/-ZARA-AI-Android',
                  'TAMCL v1.0': 'ZARA AI Project License',
                  'Tech GPTx — Official ZARA Tutorial Series': 'Sagar — ZARA AI Developer',
              },
              'app/src/main/java/com/zara/ai/security/SecurityManager.kt': {
                  'Developer       : Tech GPTx': 'Developer       : Sagar',
                  'Copyright © 2026: Tech GPTx. All Rights Reserved.': 'Copyright © 2026: Sagar. All Rights Reserved.',
                  'https://github.com/techgptx/Playlist': 'https://github.com/sagarhub2/-ZARA-AI-Android',
                  'const val DEVELOPER_NAME    = "Tech GPTx"': 'const val DEVELOPER_NAME    = "Sagar"',
                  'Copyright © 2026 Tech GPTx. All Rights Reserved.': 'Copyright © 2026 Sagar. All Rights Reserved.',
                  'TAMCL v1.0 — Content creators MUST credit Tech GPTx': 'ZARA AI Project License — Sagar',
              },
              'app/src/main/res/layout/fragment_settings.xml': {
                  'ZARA INTELLIGENCE OS • v3.1 PRO\\nEngineered by TechGPT X': 'ZARA AI • Developer: Sagar\\nCopyright © 2026 Sagar',
              },
              'app/src/main/res/layout/activity_permission.xml': {
                  'TechGPT X • Neural Assistant': 'ZARA AI • Neural Assistant',
              },
              'app/src/main/res/layout/activity_privacy_shield.xml': {
                  'System Authorized ZARA TechGPT X': 'SYSTEM AUTHORIZED • ZARA AI',
                  'ZARA INTELLIGENCE OS • TECHGPT X\\nEngineered with complete local privacy &amp; transparency': 'ZARA AI • Copyright © 2026 Sagar\\nPrivacy &amp; transparency',
              },
              'app/src/main/java/com/zara/ai/util/PromptGenerator.kt': {
                  'I was created and developed by Rehaan Sir, an expert AI creator who runs the @TechGptX YouTube channel!': 'I was created and developed by Sagar, the developer of ZARA AI.',
                  'Mujhe Rehaan Sir ne banaya aur train kiya hai, jo ek expert AI developer hain aur YouTube par @TechGptX channel chalate hain!': 'Mujhe Sagar ne develop kiya hai, jo ZARA AI ke developer hain!',
                  'Mention that Rehaan Sir is an expert AI developer, tech innovator, and creator who runs the popular YouTube channel @TechGptX.': 'Mention that Sagar is the developer of ZARA AI.',
              },
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              if not p.exists():
                  print(f'SKIP missing {filename}')
                  continue
              s = p.read_text()
              for before, after in pairs.items():
                  s = s.replace(before, after)
              p.write_text(s)
          p = Path('app/build.gradle.kts')
          s = p.read_text().replace('?: "Tech GPTx"', '?: "Sagar"')
          p.write_text(s)
          PY
          # Safely set only the launcher label; avoid rewriting arbitrary Android XML.
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('app/src/main/res').rglob('strings.xml'):
              s = p.read_text()
              s = re.sub(r'<string\s+name="app_name"[^>]*>.*?</string>', '<string name="app_name">ZARA AI</string>', s, count=1, flags=re.S)
              p.write_text(s)
          PY

      - name: Brand hands-free control as autonomous device control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('app/src/main')]
          patterns = [
              (r'Hands[ -]?Free App Control', 'ZARA AI — Autonomous Device Control'),
              (r'Hands[ -]?Free Control', 'ZARA AI — Autonomous Device Control'),
              (r'Autonomous Device Control', 'ZARA AI — Autonomous Device Control'),
          ]
          changed = []
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.kt', '.java', '.xml'}:
                      continue
                  try:
                      original = p.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = original
                  for pattern, replacement in patterns:
                      updated = re.sub(pattern, replacement, updated, flags=re.I)
                  if updated != original:
                      p.write_text(updated, encoding='utf-8')
                      changed.append(str(p))
          print('Updated hands-free/autonomous control branding in: ' + (', '.join(changed) if changed else 'no exact matching label found; source needs inspection'))
          PY

      - name: Remove YouTube links and preserve Sagar social links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main')
          # Remove YouTube URLs (do not redirect them to another site).
          youtube_url = re.compile(r'https?://(?:www\\.)?(?:youtube\\.com|youtu\\.be)[^\\s"<>]*', re.I)
          # Remove obsolete creator/channel promotions, not unrelated YouTube references in general text.
          obsolete_phrases = [
              r'I was created and developed by Rehaan Sir[^"\\n]*',
              r'Mujhe Rehaan Sir ne banaya aur train kiya hai[^"\\n]*',
              r'Mention that Rehaan Sir is an expert AI developer[^"\\n]*',
          ]
          changed = []
          remaining = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.kt', '.java', '.xml', '.json', '.html', '.txt'}:
                  continue
              try:
                  original = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = youtube_url.sub('', original)
              for phrase in obsolete_phrases:
                  updated = re.sub(phrase, '', updated, flags=re.I)
              if updated != original:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(str(p))
              if re.search(r'https?://(?:www\\.)?(?:youtube\\.com|youtu\\.be)', updated, re.I):
                  remaining.append(str(p))
          print('Removed YouTube URLs/promotional phrases from: ' + (', '.join(changed) if changed else 'no matches found'))
          print('Remaining YouTube URL references: ' + (', '.join(remaining) if remaining else 'none in scanned source files'))

          # Keep the user's own social URLs available as Android string resources.
          values = Path('app/src/main/res/values')
          values.mkdir(parents=True, exist_ok=True)
          strings = values / 'strings.xml'
          s = strings.read_text(encoding='utf-8') if strings.exists() else '<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n</resources>\\n'
          for name, value in [('sagar_telegram_url', 'https://t.me/H_sagarr'), ('sagar_instagram_url', 'https://www.instagram.com/hyee__sagar/')]:
              pattern = re.compile(r'<string\\s+name="' + re.escape(name) + r'"[^>]*>.*?</string>', re.S)
              tag = f'<string name="{name}">{value}</string>'
              s = pattern.sub(tag, s, count=1) if pattern.search(s) else s.replace('</resources>', f'    {tag}\\n</resources>')
          strings.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZARA-AI-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ZARA-AI-build-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
            ~/.gradle/daemon/*/daemon-*.out.log
          if-no-files-found: ignore
          retention-days: 7
